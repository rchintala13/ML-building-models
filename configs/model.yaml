version: 1

# Derived columns computed on the canonical DataFrame BEFORE feature selection.
# Names must exist in features/registry.py BASE_FEATURES.
#
# The '_cal' outputs are calculated counterparts to simulated schema columns,
# not replacements:
#   add_roof_area        -> roof_area_cal        (vs simulated roof_area)
#   add_ach_infiltration -> ACH_infiltration_cal (vs simulated ACHInfiltration)
#   add_bldg_volume      -> bldg_vol             (reads simulated roof_area)
#   add_sa_to_vol_ratio  -> sa_to_vol_ratio      (reads simulated roof_area)
#
# Anything listed here must also appear in a base_feature_set to reach the model.
# Order matters only through data dependencies: add_bldg_volume and
# add_sa_to_vol_ratio read the SIMULATED roof_area column, not roof_area_cal.
base_features:
  - add_roof_area
  #- add_bldg_volume
  - add_ach_infiltration
  - add_sa_to_vol_ratio

# Row-level range filters, applied after base features and before feature
# selection so they can reference simulated, derived or unselected columns.
#
# apply_to_test:
#   false -> filter the train split only; models are fitted on a restricted
#            range but scored against the full test distribution
#   true  -> filter both splits
#
# overrides are matched like usecase_space disallow rules: every field named in
# 'when' must match, omitted fields are wildcards, and later matching rules win.
# Bounds merge per column, so an override that touches one column leaves the
# rest of the global bounds in place. Set a bound to null to remove it.
#
# CAUTION: a filter that differs between proposed and baseline drops different
# buildings from each, which breaks savings pairing. train.pair_scenarios will
# raise rather than silently misalign.
filters:
  min_values:
    gross_floor_area: 400
    # roof_area: 250
    # aspect_ratio: 2.0
  max_values: {}
  apply_to_test: true

  overrides: []
  #  - when:
  #      target_set: natural_gas
  #    min_values:
  #      gross_floor_area: 500
  #  - when:
  #      usecase_id: small_office_PSZ-HP_CZ5A
  #      scenario: [proposed, baseline]
  #    max_values:
  #      window_wall_ratio: 0.6
  #    apply_to_test: true

target_sets:
  electricity:
    - total_electricity_179d
  natural_gas:
    - total_gas_179d

base_feature_sets:
  electricity:
    - aspect_ratio
    - number_of_floors
    - gross_floor_area
    - ext_wall_surface_area
    - window_area
    - ext_wall_u_factor
    - roof_u_factor
    - window_u_factor
    - window_wall_ratio
    - window_shgc
    - design_cooling_cop
    - design_heating_cop
    - design_heating_eff
    - erv_sensible_cooling
    - lpd
    - fan_power
    # derived, produced by base_features above
    - roof_area_cal
    - ACH_infiltration_cal
    - sa_to_vol_ratio

  natural_gas:
    - aspect_ratio
    - number_of_floors
    - gross_floor_area
    - ext_wall_surface_area
    - roof_area
    - window_area
    - ext_wall_u_factor
    - roof_u_factor
    - window_u_factor
    - window_wall_ratio
    - window_shgc
    - ACHInfiltration
    - design_heating_cop
    - design_heating_eff
    - water_heating_energy_factor
    - water_heating_ua
    - swh_fuel_type
    # derived, produced by base_features above
    - roof_area_cal
    - bldg_vol
    - ACH_infiltration_cal
    - sa_to_vol_ratio

# Keyed by SLUGGED system_type (see usecase_space.yaml aliases):
# HP_RTU, MSHP_DOAS, PSZ-AC_with_electric_coil, PSZ-AC_with_gas_coil,
# PSZ-HP, VRF_DOAS.
# WARNING: the two keys below match none of those, so they never fire today.
system_overrides:
  packaged_vav:
    add_features:
      - fan_power
    drop_features: []

  gas_furnace:
    add_features:
      - design_heating_eff
    drop_features:
      - design_cooling_cop

# Estimator per model_type. 'kind' selects the builder in models/factory.py;
# 'params' are passed through to the underlying estimator.
# Every key here must also appear in model_type_overrides below.
#
# 'overrides' is keyed by target_set then scenario and wins over 'params'.
# It exists because alpha was tuned per target and scenario.
#
# ridge_poly values below are carried over from the previous surrogate
# implementation (surrogate_modeling_179d_old), where they were tuned against
# the step order poly_features -> MinMaxScaler -> Ridge. Reordering those steps
# invalidates the tuning.
estimators:
  plain_linear:
    kind: linear
    params:
      scaler: minmax
      fit_intercept: true

  ridge_poly:
    kind: ridge_poly
    params:
      degree: 2
      interaction_only: false
      include_bias: false
      scaler: minmax
      fit_intercept: true
      alpha: 0.007
    overrides:
      natural_gas:
        # the one tuned value that differs from 0.007
        proposed:
          alpha: 0.001

  # Not yet tuned -- placeholder defaults.
  xgboost:
    kind: xgboost
    params:
      n_estimators: 400
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 0

model_type_overrides:
  ridge_poly:
    transforms:
      - name: add_log_transforms
        params:
          columns:
            - roof_area
            - sa_to_vol_ratio
            - ext_wall_u_factor

      - name: add_piecewise_feature
        params:
          column: gross_floor_area
          breakpoint: 1200
          left_column: gross_floor_area_le_1200
          right_column: gross_floor_area_gt_1200
          drop_original: true

  plain_linear:
    transforms: []

  xgboost:
    transforms: []

# Keyed by usecase_id. Mapping, not a list.
usecase_overrides: {}
  # small_office_packaged_vav_5a:
  #   add_features:
  #     - sa_to_vol_ratio
  #     - ACH_infiltration_cal
  #   drop_features: []
  #   transforms:
  #     - add_log_ext_wall_u_factor
  # Filters are NOT configured here -- use the top-level 'filters' block with
  # an override on when.usecase_id.