[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml179d"
version = "0.1.0"
description = "ML179D surrogate modeling repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml",
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "pyarrow",
  "matplotlib",
  "xgboost",
  "lightgbm",
]

[project.scripts]
ml179d = "ml179d.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]